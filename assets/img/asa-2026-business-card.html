<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yuanxi Li — ASA 2026</title>
    <style>
      :root {
        color: #14344f;
        font-family: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #ece9e1;
      }

      .card {
        position: relative;
        display: grid;
        width: min(100vw, 1600px);
        min-height: min(100vh, 1000px);
        grid-template-columns: 1fr 320px;
        align-items: center;
        padding: clamp(48px, 6vw, 110px);
        overflow: hidden;
        background: #fbf9f3 url("asa-2026-business-card-bg.png") -260px center / cover no-repeat;
        box-shadow: 0 20px 50px rgb(20 52 79 / 20%);
      }

      .content {
        z-index: 1;
        max-width: 860px;
      }

      h1 {
        margin: 0;
        font-size: clamp(54px, 7vw, 104px);
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }

      .role {
        margin: 28px 0 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(23px, 2.3vw, 36px);
        line-height: 1.3;
      }

      .research {
        max-width: 720px;
        margin: 24px 0 0;
        color: #31536a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(17px, 1.6vw, 25px);
        line-height: 1.45;
      }

      .contact {
        margin: 38px 0 0;
        color: #14344f;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(18px, 1.7vw, 26px);
        font-weight: 700;
      }

      .qr-panel {
        z-index: 1;
        justify-self: end;
        padding: 20px;
        text-align: center;
        background: rgb(255 255 255 / 90%);
        border: 1px solid rgb(20 52 79 / 12%);
        border-radius: 18px;
        box-shadow: 0 8px 22px rgb(20 52 79 / 12%);
      }

      .qr-panel img {
        display: block;
        width: 240px;
        height: 240px;
      }

      .qr-panel p {
        margin: 14px 0 0;
        color: #31536a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.3;
      }

      @media (max-width: 700px) {
        .card {
          min-height: 100vh;
          grid-template-columns: 1fr;
          align-content: space-between;
          padding: 44px 32px;
        }

        .qr-panel {
          justify-self: start;
          margin-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Digital business card for Yuanxi Li">
      <section class="content">
        <h1>Yuanxi Li</h1>
        <p class="role">Incoming PhD Student in Sociology<br />University of Washington</p>
        <p class="research">Computational social science, demography, social networks, and health disparities.</p>
        <p class="contact">yuanxili@uw.edu</p>
      </section>
      <aside class="qr-panel">
        <img src="asa-2026-website-qr.png" alt="QR code for yuanxil.com" />
        <p>Scan for my website</p>
      </aside>
    </main>
  </body>
</html>
